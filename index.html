<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Mein Dokument-Reader</title>
  <meta name="theme-color" content="#315f52">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <style>
    :root {
      color-scheme: light;
      --background: #f3f1eb;
      --surface: #ffffff;
      --surface-secondary: #ebe8e0;
      --text: #24211d;
      --muted: #706b62;
      --border: #ded9cf;
      --accent: #315f52;
      --accent-pressed: #244a40;
      --accent-text: #ffffff;
      --danger: #a52c2c;
      --danger-background: #fff2f2;
      --shadow: 0 3px 14px rgba(35, 31, 25, 0.08);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      max-width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      min-width: 320px;
      max-width: 100vw;
      min-height: 100dvh;
      overflow: hidden;
      color: var(--text);
      background: var(--background);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button, input { font: inherit; }
    button, label { -webkit-tap-highlight-color: transparent; }

    .app {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      width: 100%;
      max-width: 100vw;
      min-width: 0;
      height: 100dvh;
      overflow: hidden;
      background: var(--surface);
    }

    .app > *,
    .header > *,
    .content > *,
    .reader-view > *,
    .controls > * {
      min-width: 0;
      max-width: 100%;
    }

    .header {
      display: flex;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      align-items: center;
      gap: 10px;
      overflow: hidden;
      padding:
        max(10px, env(safe-area-inset-top))
        max(10px, env(safe-area-inset-right))
        10px
        max(10px, env(safe-area-inset-left));
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .header-text { min-width: 0; max-width: 100%; flex: 1 1 auto; }

    #page-title {
      margin: 0;
      overflow: hidden;
      font-size: 17px;
      line-height: 1.3;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #status {
      margin: 3px 0 0;
      overflow: hidden;
      color: var(--muted);
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #status.error { color: var(--danger); }

    .header-button,
    .file-button {
      display: inline-flex;
      min-width: 44px;
      min-height: 44px;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      user-select: none;
    }

    .header-button {
      padding: 8px 11px;
      color: var(--text);
      background: var(--surface-secondary);
      font-weight: 700;
    }

    .file-button {
      flex: 0 0 auto;
      padding: 9px 13px;
      color: var(--accent-text);
      background: var(--accent);
      font-size: 14px;
      font-weight: 700;
    }

    .header-button:active,
    .file-button:active { transform: scale(0.97); }
    .file-button:active { background: var(--accent-pressed); }

    #file-input {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
    }

    .content {
      position: relative;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background: var(--background);
    }

    .library-view {
      width: 100%;
      height: 100%;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 16px max(14px, env(safe-area-inset-right)) 24px max(14px, env(safe-area-inset-left));
    }

    .library-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 12px;
      max-width: 720px;
      margin: 0 auto 14px;
    }

    .library-heading h2 { margin: 0; font-size: 21px; }
    .library-heading p { margin: 0; color: var(--muted); font-size: 13px; }

    .book-list {
      display: grid;
      gap: 12px;
      max-width: 720px;
      margin: 0 auto;
    }

    .book-card {
      display: grid;
      grid-template-columns: 76px minmax(0, 1fr);
      gap: 14px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .book-cover {
      position: relative;
      display: grid;
      width: 76px;
      height: 108px;
      place-items: center;
      overflow: hidden;
      border-radius: 8px;
      color: var(--accent-text);
      background: var(--accent);
      font-family: Georgia, serif;
      font-size: 23px;
      font-weight: bold;
    }

    .book-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #ffffff;
    }

    .format-badge {
      position: absolute;
      right: 4px;
      bottom: 4px;
      padding: 2px 4px;
      border-radius: 4px;
      color: #ffffff;
      background: rgba(0, 0, 0, 0.66);
      font-family: system-ui, sans-serif;
      font-size: 9px;
      font-weight: 800;
    }

    .book-information {
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .book-title {
      margin: 1px 0 0;
      overflow: hidden;
      font-size: 17px;
      line-height: 1.3;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .book-author,
    .book-details {
      margin: 4px 0 0;
      overflow: hidden;
      color: var(--muted);
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .book-progress {
      margin: 7px 0 0;
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
    }

    .book-actions {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      margin-top: auto;
      padding-top: 10px;
    }

    .open-book-button,
    .delete-book-button {
      min-height: 40px;
      border-radius: 9px;
      font-weight: 700;
      cursor: pointer;
    }

    .open-book-button {
      border: 0;
      color: var(--accent-text);
      background: var(--accent);
    }

    .delete-book-button {
      padding: 0 12px;
      border: 1px solid #e5bcbc;
      color: var(--danger);
      background: var(--danger-background);
    }

    .open-book-button:active,
    .delete-book-button:active { transform: scale(0.98); }

    .empty-library {
      display: grid;
      min-height: 65vh;
      place-content: center;
      max-width: 420px;
      margin: 0 auto;
      padding: 28px;
      text-align: center;
    }

    .empty-icon {
      display: grid;
      width: 78px;
      height: 78px;
      place-items: center;
      margin: 0 auto 18px;
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--accent);
      background: var(--surface);
      font-family: Georgia, serif;
      font-size: 26px;
      font-weight: bold;
    }

    .empty-library h2 { margin: 0; font-size: 21px; }
    .empty-library p { margin: 10px 0 0; color: var(--muted); font-size: 15px; line-height: 1.5; }

    .reader-view,
    #epub-viewer,
    #pdf-reader,
    #pdf-text-reader,
    #txt-reader {
      width: 100%;
      height: 100%;
    }

    .reader-view {
      width: 100%;
      max-width: 100%;
      min-width: 0;
      overflow: hidden;
      background: var(--surface);
    }

    #epub-viewer {
      width: 100%;
      max-width: 100%;
      min-width: 0;
      background: var(--surface);
    }

    #pdf-reader,
    #pdf-text-reader,
    #txt-reader {
      width: 100%;
      max-width: 100%;
      min-width: 0;
      overflow: auto;
      overscroll-behavior: contain;
      background: var(--background);
    }

    #epub-viewer {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: pan-x pan-y;
      transform-origin: center center;
    }

    #epub-viewer > div,
    #epub-viewer iframe,
    #epub-viewer .epub-container {
      width: 100% !important;
      max-width: 100% !important;
    }

    #epub-viewer iframe {
      border: 0 !important;
    }

    #pdf-reader {
      touch-action: pan-x pan-y;
    }

    #pdf-page-wrap {
      display: flex;
      width: 100%;
      min-width: 100%;
      min-height: 100%;
      align-items: flex-start;
      justify-content: center;
      padding: 12px;
      box-sizing: border-box;
    }

    #pdf-canvas {
      display: block;
      flex: 0 0 auto;
      max-width: none;
      background: #ffffff;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.16);
      transform-origin: center center;
    }

    #pdf-text-reader {
      width: 100%;
      max-width: 100%;
      min-width: 0;
      overflow: auto;
      overscroll-behavior: contain;
      background: #f3f1eb;
      touch-action: pan-y;
    }

    #pdf-text-content {
      --pdf-text-scale: 1;
      width: min(100%, 780px);
      min-height: 100%;
      margin: 0 auto;
      padding: 18px 12px 35vh;
      transform-origin: center top;
    }

    .pdf-text-intro {
      margin: 0 2px 14px;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.72);
      font-size: 13px;
      line-height: 1.45;
    }

    .pdf-text-page {
      margin: 0 0 16px;
      padding: 18px 17px 20px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #fffdf8;
      box-shadow: var(--shadow);
      scroll-margin-top: 12px;
    }

    .pdf-text-page-number {
      margin: 0 0 14px;
      padding-bottom: 9px;
      border-bottom: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .pdf-text-block {
      margin: 0 0 0.9em;
      color: #24211d;
      font-family: Georgia, "Times New Roman", serif;
      font-size: calc(19px * var(--pdf-text-scale));
      line-height: 1.67;
      overflow-wrap: anywhere;
      hyphens: auto;
    }

    h3.pdf-text-block {
      margin-top: 1.15em;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: calc(21px * var(--pdf-text-scale));
      line-height: 1.3;
    }

    .pdf-no-text {
      color: var(--muted);
      font-style: italic;
    }

    .pdf-page-preview {
      margin-top: 16px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--surface-secondary);
      overflow: hidden;
    }

    .pdf-page-preview summary {
      min-height: 44px;
      padding: 12px 14px;
      color: var(--accent);
      font-size: 14px;
      font-weight: 750;
      cursor: pointer;
      user-select: none;
    }

    .pdf-page-preview-body {
      padding: 0 10px 10px;
      text-align: center;
    }

    .pdf-page-preview canvas {
      display: block;
      width: auto;
      max-width: 100%;
      height: auto;
      margin: 0 auto;
      background: #ffffff;
      box-shadow: 0 2px 9px rgba(0, 0, 0, 0.14);
    }

    .pdf-preview-message,
    .pdf-text-loading {
      margin: 0;
      padding: 16px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
      text-align: center;
    }

    #txt-content {
      width: min(100%, 760px);
      min-height: 100%;
      margin: 0 auto;
      padding: 24px 20px 35vh;
      color: #24211d;
      background: #fffdf8;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 18px;
      line-height: 1.72;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .controls {
      display: grid;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      gap: 9px;
      overflow: hidden;
      padding: 9px max(12px, env(safe-area-inset-right)) max(9px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
      border-top: 1px solid var(--border);
      background: var(--surface);
    }

    .pdf-mode-button {
      width: 100%;
      min-height: 42px;
      border: 1px solid var(--border);
      border-radius: 11px;
      color: var(--accent);
      background: var(--surface-secondary);
      font-size: 14px;
      font-weight: 750;
      cursor: pointer;
    }

    .pdf-mode-button:active:not(:disabled) {
      transform: scale(0.985);
    }

    .pdf-mode-button:disabled {
      opacity: 0.5;
      cursor: wait;
    }

    .navigation-controls {
      display: grid;
      width: 100%;
      min-width: 0;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 12px;
    }

    .navigation-button {
      min-width: 0;
      min-height: 48px;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      background: var(--surface);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .navigation-button:active:not(:disabled) {
      background: var(--background);
      transform: scale(0.98);
    }

    .navigation-button:disabled { opacity: 0.4; cursor: default; }
    [hidden] { display: none !important; }
    .loading { opacity: 0.55; pointer-events: none; }

    .delete-dialog-backdrop {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(20, 18, 15, 0.58);
    }

    .delete-dialog {
      width: min(100%, 420px);
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--surface);
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.28);
    }

    .delete-dialog h2 {
      margin: 0;
      font-size: 20px;
    }

    .delete-dialog p {
      margin: 10px 0 0;
      color: var(--muted);
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .delete-dialog-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 20px;
    }

    .dialog-button {
      min-height: 46px;
      border-radius: 11px;
      font-weight: 750;
      cursor: pointer;
    }

    .dialog-button.cancel {
      border: 1px solid var(--border);
      color: var(--text);
      background: var(--surface-secondary);
    }

    .dialog-button.confirm {
      border: 0;
      color: #ffffff;
      background: var(--danger);
    }

    .dialog-button:active:not(:disabled) { transform: scale(0.98); }
    .dialog-button:disabled { opacity: 0.55; cursor: wait; }

    @media (min-width: 600px) {
      .book-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>

<body>
  <main class="app">
    <header class="header">
      <button id="library-button" class="header-button" type="button" aria-label="Zurück zur Bibliothek" hidden>←</button>

      <div class="header-text">
        <h1 id="page-title">Meine Bücher</h1>
        <p id="status" aria-live="polite">Bibliothek wird geladen …</p>
      </div>

      <label class="file-button" for="file-input">+ Datei</label>
      <input id="file-input" type="file" accept="*/*">
    </header>

    <section class="content">
      <section id="library-view" class="library-view">
        <div id="library-heading" class="library-heading">
          <h2>Bibliothek</h2>
          <p id="book-count"></p>
        </div>

        <div id="empty-library" class="empty-library" hidden>
          <div class="empty-icon" aria-hidden="true">Aa</div>
          <h2>Noch keine Bücher</h2>
          <p>Tippe oben auf „+ Datei“ und wähle ein EPUB, PDF oder TXT aus.</p>
        </div>

        <div id="book-list" class="book-list"></div>
      </section>

      <section id="reader-view" class="reader-view" aria-label="Dokumentansicht" hidden>
        <div id="epub-viewer" hidden></div>

        <div id="pdf-reader" hidden>
          <div id="pdf-page-wrap">
            <canvas id="pdf-canvas"></canvas>
          </div>
        </div>

        <div id="pdf-text-reader" hidden>
          <article id="pdf-text-content"></article>
        </div>

        <div id="txt-reader" hidden>
          <article id="txt-content"></article>
        </div>
      </section>
    </section>

    <nav id="controls" class="controls" aria-label="Navigation" hidden>
      <button id="pdf-mode-button" class="pdf-mode-button" type="button" hidden>
        Aa Lesemodus
      </button>

      <div class="navigation-controls">
        <button id="previous-button" class="navigation-button" type="button">← Zurück</button>
        <button id="next-button" class="navigation-button" type="button">Weiter →</button>
      </div>
    </nav>
  </main>

  <div id="delete-dialog-backdrop" class="delete-dialog-backdrop" hidden>
    <section
      class="delete-dialog"
      role="dialog"
      aria-modal="true"
      aria-labelledby="delete-dialog-title"
      aria-describedby="delete-dialog-text"
    >
      <h2 id="delete-dialog-title">Datei löschen?</h2>
      <p id="delete-dialog-text"></p>

      <div class="delete-dialog-actions">
        <button id="cancel-delete-button" class="dialog-button cancel" type="button">
          Nein
        </button>

        <button id="confirm-delete-button" class="dialog-button confirm" type="button">
          Ja, löschen
        </button>
      </div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>

  <script type="module">
    const DATABASE_NAME = "mein-epub-reader";
    const DATABASE_VERSION = 1;
    const BOOK_STORE = "books";
    const PDFJS_VERSION = "4.10.38";
    const EPUB_ZOOM_MIN = 70;
    const EPUB_ZOOM_MAX = 180;
    const PDF_ZOOM_MIN = 50;
    const PDF_ZOOM_MAX = 250;
    const PDF_TEXT_ZOOM_MIN = 80;
    const PDF_TEXT_ZOOM_MAX = 180;
    const PINCH_ROUNDING = 5;

    let database = null;
    let pdfJsPromise = null;

    let currentBookRecord = null;
    let currentBookType = null;

    let currentEpubBook = null;
    let currentEpubRendition = null;
    let currentEpubLocation = null;
    let currentEpubZoom = 100;

    let currentPdfDocument = null;
    let currentPdfLoadingTask = null;
    let currentPdfRenderTask = null;
    let currentPdfPage = 1;
    let currentPdfZoom = 100;
    let currentPdfViewMode = "page";
    let currentPdfTextZoom = 100;
    let currentPdfTextBuilt = false;
    let pdfTextBuildToken = 0;
    let pdfPreviewObserver = null;
    const pdfTextPreviewTasks = new Set();
    let lastPdfWidth = 0;

    let saveTimer = null;
    let resizeTimer = null;
    let isNavigating = false;
    let isZooming = false;
    let isPinching = false;
    let pinchState = null;
    let pendingDeleteBookId = null;
    const libraryCoverUrls = [];
    const pinchTargets = new WeakSet();

    const fileInput = document.getElementById("file-input");
    const fileButton = document.querySelector(".file-button");
    const libraryButton = document.getElementById("library-button");
    const pageTitle = document.getElementById("page-title");
    const statusText = document.getElementById("status");
    const libraryView = document.getElementById("library-view");
    const libraryHeading = document.getElementById("library-heading");
    const emptyLibrary = document.getElementById("empty-library");
    const bookList = document.getElementById("book-list");
    const bookCount = document.getElementById("book-count");
    const readerView = document.getElementById("reader-view");
    const epubViewer = document.getElementById("epub-viewer");
    const pdfReader = document.getElementById("pdf-reader");
    const pdfPageWrap = document.getElementById("pdf-page-wrap");
    const pdfCanvas = document.getElementById("pdf-canvas");
    const pdfTextReader = document.getElementById("pdf-text-reader");
    const pdfTextContent = document.getElementById("pdf-text-content");
    const txtReader = document.getElementById("txt-reader");
    const txtContent = document.getElementById("txt-content");
    const controls = document.getElementById("controls");
    const pdfModeButton = document.getElementById("pdf-mode-button");
    const previousButton = document.getElementById("previous-button");
    const nextButton = document.getElementById("next-button");
    const deleteDialogBackdrop = document.getElementById("delete-dialog-backdrop");
    const deleteDialogText = document.getElementById("delete-dialog-text");
    const cancelDeleteButton = document.getElementById("cancel-delete-button");
    const confirmDeleteButton = document.getElementById("confirm-delete-button");


    registerServiceWorker();

    function registerServiceWorker() {
      if (!("serviceWorker" in navigator) || location.protocol === "file:") return;

      window.addEventListener("load", function () {
        navigator.serviceWorker.register("./service-worker.js").catch(function (error) {
          console.warn("Service Worker konnte nicht registriert werden:", error);
        });
      });
    }

    startApplication();

    async function startApplication() {
      setLoading(true);

      try {
        database = await openDatabase();
        await migrateTextTitles();
        await showLibrary();
      } catch (error) {
        console.error(error);
        showError("Der lokale Speicher konnte nicht geöffnet werden.");
      } finally {
        setLoading(false);
      }
    }

    fileInput.addEventListener("change", async function () {
      const file = fileInput.files[0];
      if (!file) return;

      const type = detectFileType(file);
      if (!type) {
        showError("Bitte wähle ein EPUB, PDF oder TXT aus.");
        fileInput.value = "";
        return;
      }

      await importDocument(file, type);
    });

    libraryButton.addEventListener("click", showLibrary);
    previousButton.addEventListener("click", () => navigate("previous"));
    nextButton.addEventListener("click", () => navigate("next"));
    cancelDeleteButton.addEventListener("click", closeDeleteDialog);
    confirmDeleteButton.addEventListener("click", confirmDeleteBook);
    pdfModeButton.addEventListener("click", togglePdfViewMode);

    installPinchHandlers(pdfReader, "pdf");
    installPinchHandlers(pdfTextReader, "pdfText");

    deleteDialogBackdrop.addEventListener("click", function (event) {

    document.addEventListener("keydown", function (event) {

    bookList.addEventListener("click", async function (event) {

      if (!(target instanceof Element)) return;

      const openButton = target.closest("[data-open-book]");
      if (openButton) {

      }

    txtReader.addEventListener("scroll", function () {
      if (currentBookType !== "txt" || !currentBookRecord) return;
      currentBookRecord.textScrollRatio = getScrollRatio(txtReader);
      updateReaderStatus();
      updateNavigationButtons();

    pdfReader.addEventListener("scroll", function () {
      if (currentBookType !== "pdf" || currentPdfViewMode !== "page" || !currentBookRecord) return;
      currentBookRecord.pdfScrollRatio = getScrollRatio(pdfReader);
      currentBookRecord.pdfScrollLeftRatio = getHorizontalScrollRatio(pdfReader);
      scheduleProgressSave();

    pdfTextReader.addEventListener("scroll", function () {
      if (currentBookType !== "pdf" || currentPdfViewMode !== "text" || !currentBookRecord) return;
      currentPdfPage = findCurrentPdfTextPage();
      currentBookRecord.lastPage = currentPdfPage;

    document.addEventListener("visibilitychange", function () {

    window.addEventListener("resize", function () {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(async function () {
        if (currentBookType === "pdf" && currentPdfViewMode === "page" && currentPdfDocument) {
          const width = getSafeReaderWidth(pdfReader);
          if (Math.abs(width - lastPdfWidth) >= 20) {
            await renderPdfPage(
              currentPdfPage,
              getScrollRatio(pdfReader),
              getHorizontalScrollRatio(pdfReader)
            );
          }
        }

        if (currentBookType === "epub" && currentEpubRendition) {
